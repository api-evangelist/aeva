aid: aeva
name: Aeva
description: >-
  Aeva Technologies is a Mountain View, California sensing and perception company
  that builds 4D LiDAR based on proprietary Frequency Modulated Continuous Wave
  (FMCW) technology, measuring instant velocity in addition to 3D position for
  every point in a scene. Its product line spans Atlas and Atlas Ultra long-range
  automotive-grade sensors, the Omni wide-view short-range sensor, and Eve 1
  precision laser speed sensors for factory automation, serving autonomous
  vehicles, robotics, industrial automation, security, and physical-AI markets.
  Aeva is a hardware and perception-software provider rather than a web-API
  company: its developer surface is open-source software on the aevainc GitHub
  org (the AevaScenes Python SDK and Doppler ICP), the AevaScenes dataset, and
  product SDK/EULA-gated software delivered with its sensors. No public REST or
  web API is published.
